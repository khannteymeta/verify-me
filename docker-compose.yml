services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5435:5432" # 5432-5434 are taken by other local Postgres instances
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379" # 6379 is often taken by another local Redis

volumes:
  pgdata:
